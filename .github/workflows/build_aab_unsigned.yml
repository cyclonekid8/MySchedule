name: Build MySchedule AAB Unsigned (Play Store)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (increment each release e.g. 2, 3, 4)'
        required: true
        default: '2'
      version_name:
        description: 'Version name (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/myschedule.jks

      - name: Build release AAB
        run: |
          flutter build appbundle --release --no-tree-shake-icons \
            --build-number=${{ github.event.inputs.version_code }} \
            --build-name=${{ github.event.inputs.version_name }} \
            -Pandroid.injected.signing.store.file=$PWD/android/app/myschedule.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MySchedule-AAB-v${{ github.event.inputs.version_name }}
          path: build/app/outputs/bundle/release/app-release.aab
