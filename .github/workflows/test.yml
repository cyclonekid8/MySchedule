name: MySchedule Tests

on:
  push:
    branches:
      - premium-features-testing
      - premium-features-sharpen
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── Job 1: Unit & Widget Tests ─────────────────────────────────────
  unit_and_widget_tests:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        run: dart format lib/

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests - Activity Model
        run: flutter test test/unit/activity_model_test.dart --reporter=expanded

      - name: Run unit tests - Note Model
        run: flutter test test/unit/note_model_test.dart --reporter=expanded

      - name: Run unit tests - ScheduleProvider
        run: flutter test test/unit/schedule_provider_test.dart --reporter=expanded

      - name: Run unit tests - PurchaseService
        run: flutter test test/unit/purchase_service_test.dart --reporter=expanded

      - name: Run unit tests - ThemeProvider
        run: flutter test test/unit/theme_provider_test.dart --reporter=expanded

      - name: Run widget tests - Schedule Screen
        run: flutter test test/widget/schedule_screen_test.dart --reporter=expanded

      - name: Run widget tests - Calendar Screen
        run: flutter test test/widget/calendar_screen_test.dart --reporter=expanded

      - name: Run widget tests - Add Activity Screen
        run: flutter test test/widget/add_activity_screen_test.dart --reporter=expanded

      - name: Run widget tests - Notes Screen
        run: flutter test test/widget/notes_screen_test.dart --reporter=expanded

      - name: Run widget tests - Settings Screen
        run: flutter test test/widget/settings_screen_test.dart --reporter=expanded

      - name: Generate test coverage report
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  # ── Job 2: Integration / E2E Tests ────────────────────────────────
  integration_tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: unit_and_widget_tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration & E2E tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 6
          script: |
            adb kill-server || true
            adb start-server
            adb devices
            adb logcat -c
            adb logcat -v time *:W flutter:V > logcat.txt &
            LOGCAT_PID=$!
            flutter build apk --debug
            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant com.cyclonekid.myschedule android.permission.POST_NOTIFICATIONS 2>/dev/null || true
            adb reverse tcp:8080 tcp:8080 || true
            adb reverse tcp:9000 tcp:9000 || true
            flutter test integration_test/app_test.dart --reporter=expanded --timeout=300s
            kill $LOGCAT_PID || true

      - name: Upload logcat on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-output
          path: logcat.txt

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: screenshots/

  # ── Job 3: Build APK (only if all tests pass) ──────────────────────
  build_apk:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    needs: [unit_and_widget_tests, integration_tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Build signed APK (with split-debug-info for smaller size)
        run: |
          flutter build apk --release \
            --split-debug-info=build/debug-info \
            --obfuscate

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySchedule-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/debug-info/
